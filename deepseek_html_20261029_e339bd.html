        <button data-cmd="justifyRight">➡</button>
        <div class="sep"></div>
        <button id="wSave">💾 Guardar</button>
        <button id="wDownload">⬇️ Descargar</button>
      `;
      const editorWrap = document.createElement('div');
      editorWrap.className = 'word-editor';
      const page = document.createElement('div');
      page.className = 'word-page';
      page.contentEditable = 'true';
      page.innerHTML = `<h1 style="text-align:center;">Documento</h1><p>Escribe aquí...</p>`;
      editorWrap.appendChild(page);
      body.append(tools, editorWrap);

      tools.querySelectorAll('button[data-cmd]').forEach(b => {
        b.onmousedown = (e) => { e.preventDefault(); document.execCommand(b.dataset.cmd, false, null); page.focus(); };
      });
      tools.querySelector('#wFont').onchange = (e) => { document.execCommand('fontName', false, e.target.value); page.focus(); };
      tools.querySelector('#wColor').oninput = (e) => { document.execCommand('foreColor', false, e.target.value); page.focus(); };
      tools.querySelector('#wBg').oninput = (e) => { document.execCommand('hiliteColor', false, e.target.value); page.focus(); };
      tools.querySelector('#wSize').onchange = (e) => {
        const size = e.target.value;
        const sel = window.getSelection();
        if (sel.rangeCount && !sel.isCollapsed) {
          const range = sel.getRangeAt(0);
          const span = document.createElement('span');
          span.style.fontSize = size + 'px';
          try { span.appendChild(range.extractContents()); range.insertNode(span); } catch(err){}
        }
        page.focus();
      };
      tools.querySelector('#wSave').onclick = async () => {
        const name = await askInput('Nombre (en /Documentos):', 'documento.html');
        if (!name) return;
        const folder = fs.root.children['Documentos'];
        const finalName = uniqueName(folder, name);
        const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body style="font-family:Georgia,serif;font-size:15px;line-height:1.7;max-width:720px;margin:40px auto;padding:20px;">${page.innerHTML}</body></html>`;
        folder.children[finalName] = { type: 'file', content: html, mime: 'text/html' };
        try { saveFS(); notify('WordPad', `Documentos/${finalName}`); refreshAllFileManagers(); renderDesktopIcons(); }
        catch(e) { notify('Error', 'No se pudo guardar'); }
      };
      tools.querySelector('#wDownload').onclick = () => {
        const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body style="font-family:Georgia,serif;font-size:15px;line-height:1.7;max-width:720px;margin:40px auto;padding:20px;">${page.innerHTML}</body></html>`;
        const blob = new Blob([html], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'documento.html'; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        notify('Descarga', 'Documento descargado');
      };
    }
  });
}

// ================= CALCULADORA =================
function openCalculator() {
  createWindow({
    title: 'Calculadora', icon: '🧮',
    width: 320, height: 460, app: 'calc',
    contentBuilder: (body) => {
      body.style.background = '#202020';
      body.innerHTML = `
        <div style="display:flex;flex-direction:column;height:100%;padding:12px;">
          <div id="calcDisplay" style="background:#202020;color:#fff;font-size:32px;text-align:right;padding:14px 16px;overflow:hidden;min-height:60px;word-break:break-all;">0</div>
          <div id="calcBtns" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1;margin-top:12px;"></div>
        </div>
      `;
      const display = body.querySelector('#calcDisplay');
      const btns = body.querySelector('#calcBtns');
      let cur = '0', prev = null, op = null, waiting = false;
      const layout = [['C','⌫','%','÷'],['7','8','9','×'],['4','5','6','−'],['1','2','3','+'],['±','0','.','=']];
      layout.forEach(row => row.forEach(lbl => {
        const b = document.createElement('button');
        b.textContent = lbl;
        b.style.cssText = 'padding:0;border:none;border-radius:4px;font-size:18px;cursor:pointer;color:#fff;background:#333;';
        if (['÷','×','−','+','='].includes(lbl)) b.style.background = '#0078d4';
        if (['C','⌫','%','±'].includes(lbl)) b.style.background = '#404040';
        b.onclick = () => handle(lbl);
        btns.appendChild(b);
      }));
      function handle(l) {
        if (l === 'C') { cur='0'; prev=null; op=null; waiting=false; }
        else if (l === '⌫') { cur = cur.length>1 ? cur.slice(0,-1) : '0'; }
        else if (l === '±') { cur = cur.startsWith('-') ? cur.slice(1) : (cur==='0'?'0':'-'+cur); }
        else if (l === '%') { cur = String(parseFloat(cur)/100); }
        else if ('0123456789.'.includes(l)) {
          if (waiting) { cur = l==='.' ? '0.' : l; waiting = false; }
          else { if (l === '.' && cur.includes('.')) return; cur = cur === '0' && l !== '.' ? l : cur + l; }
        } else if (['÷','×','−','+'].includes(l)) {
          if (op && !waiting) cur = String(calc(prev, parseFloat(cur), op));
          prev = parseFloat(cur); op = l; waiting = true;
        } else if (l === '=') {
          if (op) { cur = String(calc(prev, parseFloat(cur), op)); op = null; waiting = true; }
        }
        display.textContent = cur;
      }
      function calc(a, b, o) {
        if (o === '+') return a + b; if (o === '−') return a - b;
        if (o === '×') return a * b; if (o === '÷') return b === 0 ? 'Error' : a / b;
        return b;
      }
    }
  });
}

function openClockApp() {
  createWindow({
    title: 'Reloj', icon: '⏰',
    width: 380, height: 280, app: 'clock',
    contentBuilder: (body) => {
      body.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111;color:#fff;';
      const timeEl = document.createElement('div');
      timeEl.style.cssText = 'font-size:64px;font-weight:300;letter-spacing:2px;';

      dateEl.style.cssText = 'font-size:16px;color:#bbb;margin-top:8px;';

      const update = () => {
        const d = new Date();

    }
  });
}

// ================= ATAJOS GLOBALES =================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    hideContextMenu(); closeStartMenu();
    document.getElementById('taskView').classList.remove('open');
  }
  if (e.altKey && e.key === 'Tab') {
    e.preventDefault();
    document.getElementById('taskView').classList.add('open');
  }
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'p') { e.preventDefault(); openPaint(); }
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'w') { e.preventDefault(); openWord(); }
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'e') { e.preventDefault(); openCodeStudio(); }

  if (activeWinId && windows.get(activeWinId)?.app === 'files') {
    const winBody = windows.get(activeWinId).el.querySelector('.window-body');
    const fmList = winBody.querySelector('.fm-list');
    if (!fmList) return;
    const selected = [...fmList.querySelectorAll('.fm-item.selected')];
    const currentPath = winBody._currentPath || [];
    if (e.ctrlKey && e.key.toLowerCase() === 'c' && selected.length) {
      e.preventDefault(); clipboardCopy(selected.map(el => [...currentPath, el.dataset.name]));
    }
    if (e.ctrlKey && e.key.toLowerCase() === 'x' && selected.length) {
      e.preventDefault(); clipboardCut(selected.map(el => [...currentPath, el.dataset.name]));
    }
    if (e.ctrlKey && e.key.toLowerCase() === 'v' && fsClipboard.items.length) {
      e.preventDefault(); clipboardPaste(currentPath); renderDesktopIcons();
    }
  }
});
